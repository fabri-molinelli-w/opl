openapi: 3.0.3
info:
  title: OPL API
  version: 0.1.0
  description: |
    API del backend de OPL (Operations Pilot Library).
    Fuente única de verdad: el código del servidor Go (oapi-codegen) y el cliente
    del frontend (Orval) se generan desde este archivo. Editar acá primero.
servers:
  - url: http://localhost:8080
tags:
  - name: system
  - name: auth
  - name: users

paths:
  /api/health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Estado del backend y de sus dependencias
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Inicia sesión y devuelve un JWT
      security: []
      x-min-role: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Datos del usuario autenticado
      x-min-role: soporte
      responses:
        "200":
          description: Usuario actual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/me/password:
    post:
      tags: [auth]
      operationId: changeOwnPassword
      summary: Cambia la contraseña del usuario autenticado
      x-min-role: soporte
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Contraseña actualizada
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: Lista los usuarios
      x-min-role: admin
      responses:
        "200":
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [users]
      operationId: createUser
      summary: Crea un usuario
      x-min-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/users/{id}:
    patch:
      tags: [users]
      operationId: updateUser
      summary: Actualiza un usuario (nombre, email, rol, estado)
      x-min-role: admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  # Los endpoints de cada caso de uso se agregan acá siguiendo docs/specs/
  # y el skill endpoint-spec-first.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          enum: [up, down]
        version:
          type: string

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: validation_error
        message:
          type: string
          example: El campo ip no es una dirección válida
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"

    ErrorDetail:
      type: object
      required: [field, issue]
      properties:
        field:
          type: string
        issue:
          type: string

    Role:
      type: string
      enum: [admin, sysadmin, soporte]

    User:
      type: object
      required: [id, email, name, role, active, createdAt, updatedAt]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    CreateUserRequest:
      type: object
      required: [email, name, password, role]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        password:
          type: string
          minLength: 8
        role:
          $ref: "#/components/schemas/Role"

    UpdateUserRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
        active:
          type: boolean

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8

    Environment:
      type: string
      enum: [prod, staging, dev]

    ServiceStatus:
      type: string
      enum: [UP, DOWN, DEGRADED, UNKNOWN]

    Severity:
      type: string
      enum: [SEV1, SEV2, SEV3, SEV4]

  responses:
    BadRequest:
      description: Datos inválidos
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: No autenticado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: El rol no tiene permiso
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Recurso inexistente
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflicto (duplicado o transición inválida)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnavailable:
      description: Backend operativo pero con dependencias caídas
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Health" }
security:
  - bearerAuth: []
