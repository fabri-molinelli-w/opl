openapi: 3.0.3
info:
  title: OPL API
  version: 0.1.0
  description: |
    API del backend de OPL (Operations Pilot Library).
    Fuente única de verdad: el código del servidor Go (oapi-codegen) y el cliente
    del frontend (Orval) se generan desde este archivo. Editar acá primero.
servers:
  - url: http://localhost:8080
tags:
  - name: system
  - name: auth
  - name: users
  - name: servers
  - name: services
  - name: documents
  - name: chat

paths:
  /api/health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Estado del backend y de sus dependencias
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Inicia sesión y devuelve un JWT
      security: []
      x-min-role: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Datos del usuario autenticado
      x-min-role: soporte
      responses:
        "200":
          description: Usuario actual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/me/password:
    post:
      tags: [auth]
      operationId: changeOwnPassword
      summary: Cambia la contraseña del usuario autenticado
      x-min-role: soporte
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Contraseña actualizada
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: Lista los usuarios
      x-min-role: admin
      responses:
        "200":
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [users]
      operationId: createUser
      summary: Crea un usuario
      x-min-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/users/{id}:
    patch:
      tags: [users]
      operationId: updateUser
      summary: Actualiza un usuario (nombre, email, rol, estado)
      x-min-role: admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/servers:
    get:
      tags: [servers]
      operationId: listServers
      summary: Lista servidores con filtros combinables
      x-min-role: soporte
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: q
          in: query
          schema:
            type: string
        - name: environment
          in: query
          schema:
            $ref: "#/components/schemas/Environment"
        - name: os
          in: query
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Servidores paginados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedServers"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [servers]
      operationId: createServer
      summary: Crea un servidor
      x-min-role: sysadmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServerRequest"
      responses:
        "201":
          description: Servidor creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/servers/{id}:
    get:
      tags: [servers]
      operationId: getServer
      summary: Ficha de un servidor con sus servicios
      x-min-role: soporte
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Servidor con servicios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [servers]
      operationId: updateServer
      summary: Actualiza parcialmente un servidor
      x-min-role: sysadmin
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServerRequest"
      responses:
        "200":
          description: Servidor actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [servers]
      operationId: deleteServer
      summary: Baja lógica de un servidor y sus servicios
      x-min-role: sysadmin
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "204":
          description: Servidor dado de baja
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/services:
    get:
      tags: [services]
      operationId: listServices
      summary: Lista servicios con filtros combinables
      x-min-role: soporte
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: serverId
          in: query
          schema:
            type: string
        - name: environment
          in: query
          schema:
            $ref: "#/components/schemas/Environment"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ServiceStatus"
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/ServiceType"
      responses:
        "200":
          description: Servicios paginados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedServices"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [services]
      operationId: createService
      summary: Crea un servicio
      x-min-role: sysadmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceRequest"
      responses:
        "201":
          description: Servicio creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/services/{id}:
    get:
      tags: [services]
      operationId: getService
      summary: Detalle de un servicio
      x-min-role: soporte
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Servicio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [services]
      operationId: updateService
      summary: Actualiza parcialmente un servicio
      x-min-role: sysadmin
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServiceRequest"
      responses:
        "200":
          description: Servicio actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [services]
      operationId: deleteService
      summary: Baja lógica de un servicio
      x-min-role: sysadmin
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "204":
          description: Servicio dado de baja
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/documents:
    get:
      tags: [documents]
      operationId: listDocuments
      summary: Lista y busca documentos
      x-min-role: soporte
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: q
          in: query
          description: Texto a buscar en título, contenido y etiquetas
          schema:
            type: string
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/DocumentCategory"
        - name: tag
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            $ref: "#/components/schemas/DocumentSort"
        - name: order
          in: query
          schema:
            $ref: "#/components/schemas/SortOrder"
      responses:
        "200":
          description: Documentos paginados (sin contenido)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedDocuments"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [documents]
      operationId: createDocument
      summary: Crea un documento
      x-min-role: soporte
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDocumentRequest"
      responses:
        "201":
          description: Documento creado (versión 1)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/documents/tags:
    get:
      tags: [documents]
      operationId: listDocumentTags
      summary: Etiquetas en uso (para autocompletar)
      x-min-role: soporte
      responses:
        "200":
          description: Etiquetas ordenadas alfabéticamente
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/documents/{id}:
    get:
      tags: [documents]
      operationId: getDocument
      summary: Documento completo
      x-min-role: soporte
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Documento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [documents]
      operationId: updateDocument
      summary: Edita un documento y genera una versión nueva
      x-min-role: soporte
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDocumentRequest"
      responses:
        "200":
          description: Documento actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [documents]
      operationId: deleteDocument
      summary: Baja lógica de un documento
      x-min-role: sysadmin
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "204":
          description: Documento dado de baja
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/documents/{id}/versions:
    get:
      tags: [documents]
      operationId: listDocumentVersions
      summary: Historial de versiones (solo metadatos)
      x-min-role: soporte
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Versiones, de la más nueva a la más vieja
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentVersionSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/documents/{id}/versions/{version}:
    get:
      tags: [documents]
      operationId: getDocumentVersion
      summary: Contenido de una versión
      x-min-role: soporte
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - name: version
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Versión
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/chat:
    post:
      tags: [chat]
      operationId: chatWithOpsbot
      summary: Consulta a OPSBot (RAG sobre la documentación + estado del inventario, solo lectura)
      x-min-role: soporte
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Respuesta de OPSBot con sus fuentes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"

  # Los endpoints de cada caso de uso se agregan acá siguiendo docs/specs/
  # y el skill endpoint-spec-first.

components:
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          enum: [up, down]
        version:
          type: string

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: validation_error
        message:
          type: string
          example: El campo ip no es una dirección válida
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"

    ErrorDetail:
      type: object
      required: [field, issue]
      properties:
        field:
          type: string
        issue:
          type: string

    Role:
      type: string
      enum: [admin, sysadmin, soporte]

    User:
      type: object
      required: [id, email, name, role, active, createdAt, updatedAt]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    CreateUserRequest:
      type: object
      required: [email, name, password, role]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        password:
          type: string
          minLength: 8
        role:
          $ref: "#/components/schemas/Role"

    UpdateUserRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
        active:
          type: boolean

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8

    Environment:
      type: string
      enum: [prod, staging, dev]

    ServiceStatus:
      type: string
      enum: [UP, DOWN, DEGRADED, UNKNOWN]

    Severity:
      type: string
      enum: [SEV1, SEV2, SEV3, SEV4]

    Location:
      type: string
      enum: [onprem, cloud]

    ServiceType:
      type: string
      enum: [web, db, queue, other]

    CheckType:
      type: string
      enum: [http, tcp]

    Server:
      type: object
      required: [id, hostname, ip, environment, os, location, owner, tags, createdAt, updatedAt]
      properties:
        id:
          type: string
        hostname:
          type: string
          minLength: 1
        ip:
          type: string
          description: IPv4 o IPv6 válida
          example: 192.0.2.11
        environment:
          $ref: "#/components/schemas/Environment"
        os:
          type: string
        location:
          $ref: "#/components/schemas/Location"
        owner:
          type: string
        tags:
          type: array
          items:
            type: string
        services:
          type: array
          description: Presente en GET /api/servers/{id}
          items:
            $ref: "#/components/schemas/Service"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateServerRequest:
      type: object
      required: [hostname, ip, environment]
      properties:
        hostname:
          type: string
          minLength: 1
        ip:
          type: string
        environment:
          $ref: "#/components/schemas/Environment"
        os:
          type: string
        location:
          $ref: "#/components/schemas/Location"
        owner:
          type: string
        tags:
          type: array
          items:
            type: string

    UpdateServerRequest:
      type: object
      minProperties: 1
      properties:
        hostname:
          type: string
          minLength: 1
        ip:
          type: string
        environment:
          $ref: "#/components/schemas/Environment"
        os:
          type: string
        location:
          $ref: "#/components/schemas/Location"
        owner:
          type: string
        tags:
          type: array
          items:
            type: string

    Service:
      type: object
      required: [id, serverId, name, type, port, checkType, checkTarget, expectedStatus, intervalSeconds, latencyThresholdMs, currentStatus, createdAt, updatedAt]
      properties:
        id:
          type: string
        serverId:
          type: string
        name:
          type: string
          minLength: 1
        type:
          $ref: "#/components/schemas/ServiceType"
        port:
          type: integer
          minimum: 1
          maximum: 65535
        checkType:
          $ref: "#/components/schemas/CheckType"
        checkTarget:
          type: string
        expectedStatus:
          type: integer
          minimum: 100
          maximum: 599
          default: 200
        intervalSeconds:
          type: integer
          minimum: 1
          default: 30
        latencyThresholdMs:
          type: integer
          minimum: 1
          default: 1000
        currentStatus:
          $ref: "#/components/schemas/ServiceStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateServiceRequest:
      type: object
      required: [serverId, name, type, port, checkType, checkTarget]
      properties:
        serverId:
          type: string
        name:
          type: string
          minLength: 1
        type:
          $ref: "#/components/schemas/ServiceType"
        port:
          type: integer
          minimum: 1
          maximum: 65535
        checkType:
          $ref: "#/components/schemas/CheckType"
        checkTarget:
          type: string
        expectedStatus:
          type: integer
          minimum: 100
          maximum: 599
          default: 200
        intervalSeconds:
          type: integer
          minimum: 1
          default: 30
        latencyThresholdMs:
          type: integer
          minimum: 1
          default: 1000

    UpdateServiceRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        type:
          $ref: "#/components/schemas/ServiceType"
        port:
          type: integer
          minimum: 1
          maximum: 65535
        checkType:
          $ref: "#/components/schemas/CheckType"
        checkTarget:
          type: string
        expectedStatus:
          type: integer
          minimum: 100
          maximum: 599
        intervalSeconds:
          type: integer
          minimum: 1
        latencyThresholdMs:
          type: integer
          minimum: 1

    PaginatedServers:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Server"
        total:
          type: integer
          format: int64
        page:
          type: integer
        pageSize:
          type: integer

    PaginatedServices:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Service"
        total:
          type: integer
          format: int64
        page:
          type: integer
        pageSize:
          type: integer

    DocumentCategory:
      type: string
      enum: [procedimiento, runbook, guia, configuracion, referencia]

    DocumentSort:
      type: string
      enum: [title, updatedAt]

    SortOrder:
      type: string
      enum: [asc, desc]

    DocumentSummary:
      type: object
      required: [id, title, category, tags, version, updatedByName, createdAt, updatedAt]
      properties:
        id:
          type: string
        title:
          type: string
        category:
          $ref: "#/components/schemas/DocumentCategory"
        tags:
          type: array
          items:
            type: string
        version:
          type: integer
        updatedByName:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Document:
      type: object
      required: [id, title, contentMd, category, tags, version, createdByName, updatedByName, createdAt, updatedAt]
      properties:
        id:
          type: string
        title:
          type: string
        contentMd:
          type: string
          description: Contenido en Markdown (se renderiza sin HTML crudo)
        category:
          $ref: "#/components/schemas/DocumentCategory"
        tags:
          type: array
          items:
            type: string
        version:
          type: integer
          description: Versión actual; se envía en el PATCH para el bloqueo optimista
        createdByName:
          type: string
        updatedByName:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateDocumentRequest:
      type: object
      required: [title, contentMd, category]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 150
        contentMd:
          type: string
          minLength: 1
        category:
          $ref: "#/components/schemas/DocumentCategory"
        tags:
          type: array
          maxItems: 20
          items:
            type: string

    UpdateDocumentRequest:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 150
        contentMd:
          type: string
          minLength: 1
        category:
          $ref: "#/components/schemas/DocumentCategory"
        tags:
          type: array
          maxItems: 20
          items:
            type: string
        version:
          type: integer
          minimum: 1
          description: Versión que se editó. Si no coincide con la actual → 409.

    PaginatedDocuments:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DocumentSummary"
        total:
          type: integer
          format: int64
        page:
          type: integer
        pageSize:
          type: integer

    DocumentVersionSummary:
      type: object
      required: [version, title, editedByName, createdAt]
      properties:
        version:
          type: integer
        title:
          type: string
        editedByName:
          type: string
        createdAt:
          type: string
          format: date-time

    DocumentVersion:
      type: object
      required: [version, title, contentMd, category, tags, editedByName, createdAt]
      properties:
        version:
          type: integer
        title:
          type: string
        contentMd:
          type: string
        category:
          $ref: "#/components/schemas/DocumentCategory"
        tags:
          type: array
          items:
            type: string
        editedByName:
          type: string
        createdAt:
          type: string
          format: date-time

    ChatRequest:
      type: object
      required: [sessionId, message]
      properties:
        sessionId:
          type: string
          minLength: 1
          maxLength: 100
        message:
          type: string
          minLength: 1
          maxLength: 4000

    ChatSourceType:
      type: string
      enum: [document, service, server]

    ChatSource:
      type: object
      required: [type, id, title]
      properties:
        type:
          $ref: "#/components/schemas/ChatSourceType"
        id:
          type: string
        title:
          type: string

    ChatResponse:
      type: object
      required: [answer, sources]
      properties:
        answer:
          type: string
          description: Respuesta en Markdown
        sources:
          type: array
          items:
            $ref: "#/components/schemas/ChatSource"

  responses:
    BadRequest:
      description: Datos inválidos
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: No autenticado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: El rol no tiene permiso
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Recurso inexistente
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflicto (duplicado o transición inválida)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: Dependencia no disponible (por ejemplo, OPSBot)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnavailable:
      description: Backend operativo pero con dependencias caídas
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Health" }
security:
  - bearerAuth: []
