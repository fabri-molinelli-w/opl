version: "2"

linters:
  default: standard
  enable:
    - gocritic
    - misspell
  settings:
    misspell:
      # Textos de UI y datos semilla en español (AGENTS.md §10).
      ignore-rules:
        - responsable
        - problemas
        - configuracion
        - autor
  exclusions:
    paths:
      - internal/api/gen/
      - internal/db/gen/

formatters:
  enable:
    - gofmt
